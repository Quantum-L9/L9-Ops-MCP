# L9 Protected Files Policy — Source of Truth
# ══════════════════════════════════════════════════════════════
# Loaded and enforced by: scripts/validate-protected-files-v6.py
#   (CI: .github/workflows/08-L11-CI-WORKFLOW-v3.3.yaml, job protected-files)
# Path list: decision D-11 A — this repository's own core; paths copied from
#   another repository layout (runtime/, core/, memory/, .github/scripts/)
#   were removed.
# Spec: L9 Protected Files Enforcement System v6.0.0
#
# DORA:
#   component_id: PFP-FOUND-001
#   tier: foundation
#   lifecycle: production
#   owner: LCTO
# ══════════════════════════════════════════════════════════════

version: "6.0.0"
enforcement_mode: fail_closed

categories:
  lcto_controlled:
    description: "LCTO-controlled surfaces (infra + governance core)"
    approval_required: true
    approval_authority:
      - LCTO
      - IGOR
    protected_paths:
      # Package core
      - "src/l9_ops_mcp/**"

      # Docker / Infra
      - Dockerfile
      - "Dockerfile.*"
      - "docker-compose*.yml"
      - .dockerignore

      # Core dependency + packaging
      - pyproject.toml
      - requirements.txt
      - "requirements-*.txt"
      - Makefile

      # Governance system (meta-protection)
      - "config/policies/**"
      - ".github/workflows/**"
      - scripts/validate-protected-files-v6.py

      # Repo security posture
      - .gitleaks.toml
      - .pre-commit-config.yaml
      - codecov.yml
      - ruff.toml
      - pytest.ini

  subsystem_protected:
    description: "Subsystem ownership enforcement"
    # The previous subsystems (core/agents, memory/, core/tools) do not exist
    # in this repository (D-11 A). src/l9_ops_mcp/** is protected above.
    subsystems: {}

approval_signals:
  pr_labels:
    - LCTO_APPROVED
    - IGOR_APPROVED
  commit_message_tokens:
    - HIL_APPROVED
    - IGOR_APPROVED

meta_protected_files:
  - config/policies/protected_files.yaml
  - scripts/validate-protected-files-v6.py
  - .github/workflows/08-L11-CI-WORKFLOW-v3.3.yaml
