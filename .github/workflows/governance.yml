name: l9-ops governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Establish declared repository dependencies
        run: make setup
      - name: Validate repository structure and command wiring
        run: make validate
      - name: Enforce static and governance checks
        run: make check
      - name: Execute repository and L11 tests
        run: make test

  eval-on-demand:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[eval]')
    steps:
      - uses: actions/checkout@v4
      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx promptfoo eval --config evals/promptfooconfig.yaml
