# --- L9_META ---
# l9_schema: 1
# artifact_type: project_config
# component: l9_ops_mcp_package
# tags: [mcp, control-plane, packaging]
# retrieval: on_demand
# status: active
# --- /L9_META ---

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l9-ops-mcp"
version = "0.3.0"
description = "L9 MCP operations control plane for TransportPacket routing, skill/kernel retrieval, and downstream agent consumers."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff~=0.16.0",
  "mypy>=1.10",
  "bandit>=1.7",
  "radon>=6.0",
]

[project.scripts]
l9-action-governor = "l9_action_governor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# ruff 0.16 changed the default rule set from classic (E4/E7/E9/F) to a broad
# ruleset, which turned previously-green main red (N999 on intentional
# scripts/0*-L11-*.py names, plus UP/PLW/BLE/EXE debt across scripts/).
# Pin the historical CI contract explicitly; expand select in a dedicated PR.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Numbered L11 entrypoint filenames are intentional legacy paths (shims).
"scripts/0*-L11-*.py" = ["N999"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "scripts"]
