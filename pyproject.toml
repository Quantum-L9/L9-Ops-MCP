# --- L9_META ---
# l9_schema: 1
# artifact_type: project_config
# component: l9_ops_mcp_package
# tags: [mcp, control-plane, packaging, graphiti, memory]
# retrieval: on_demand
# status: active
# --- /L9_META ---

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l9-ops-mcp"
version = "0.4.0"
description = "L9 MCP operations control plane: TransportPacket routing, Graphiti-backed memory, hydrator, admission gate."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "structlog>=24.0",
  "graphiti-core>=0.3.17",
  "neo4j>=5.20.0",
  "mcp[cli]>=1.2.0",
  "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff~=0.16.0",
  "mypy>=1.10",
  "bandit>=1.7",
  "radon>=6.0",
]

[project.scripts]
l9-action-governor = "l9_action_governor.cli:main"
l9-mcp-server      = "l9_ops_mcp.server:main"
l9-preflight       = "l9_ops_mcp.preflight:main"
l9-seed            = "l9_ops_mcp.seed:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/0*-L11-*.py" = ["N999"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
  "graphiti_core",
  "graphiti_core.*",
  "tiktoken",
  "mcp",
  "mcp.*",
  "numpy",
  "numpy.*",
  "neo4j",
  "neo4j.*",
]
ignore_missing_imports = true
ignore_errors = true
follow_imports = "skip"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "scripts"]
asyncio_mode = "auto"
